<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tåglogg</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tåglogg">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #14202f;
    --muted: #6b7a90;
    --line: #e1e6ee;
    --accent: #1f5fbf;
    --seen: #1f5fbf;
    --rode: #c2410c;
    --header: #0f1b2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1320;
      --card: #14202f;
      --text: #e8edf5;
      --muted: #8fa3bf;
      --line: #25344a;
      --accent: #5b9bff;
      --seen: #5b9bff;
      --rode: #fb923c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--header);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .total { font-size: 14px; opacity: .8; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .logger {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .logger input {
    width: 100%;
    font-size: 22px;           /* >=16px hindrar iOS från att zooma */
    padding: 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    text-transform: uppercase;
    outline: none;
  }
  .logger input::placeholder { text-transform: none; font-size: 18px; }
  .logger input:focus { border-color: var(--accent); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .buttons button {
    font-size: 19px; font-weight: 600;
    padding: 16px 8px;
    border: 0; border-radius: 12px;
    color: #fff;
  }
  .buttons button:active { transform: scale(.98); opacity: .9; }
  #btn-seen { background: var(--seen); }
  #btn-rode { background: var(--rode); }
  .toast {
    min-height: 22px;
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .toast.error { color: #dc2626; }

  .day { margin-top: 22px; }
  .day h2 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    display: flex; justify-content: space-between;
  }
  .entries {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .entry {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  .entry:first-child { border-top: 0; }
  .entry .time { color: var(--muted); font-variant-numeric: tabular-nums; width: 46px; flex: none; }
  .entry .num { flex: 1; font-weight: 600; font-size: 18px; word-break: break-word; }
  .badge {
    font-size: 12px; font-weight: 600; color: #fff;
    padding: 3px 9px; border-radius: 999px; flex: none;
  }
  .badge.seen { background: var(--seen); }
  .badge.rode { background: var(--rode); }
  .entry .del {
    border: 0; background: none; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 6px 8px; flex: none;
  }
  .empty { text-align: center; color: var(--muted); margin: 40px 0; }

  footer { margin-top: 30px; }
  footer h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .export { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .export button {
    font-size: 15px; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text);
  }
  footer p { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Tåglogg</h1>
  <span class="total" id="total"></span>
</header>

<main>
  <section class="logger">
    <input id="num" type="text" placeholder="Fordonsnummer (t.ex. Rc6 1362)"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
           enterkeyhint="done" aria-label="Fordonsnummer">
    <div class="buttons">
      <button type="button" id="btn-seen">Sett</button>
      <button type="button" id="btn-rode">Åkt</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <div id="log"></div>

  <footer>
    <h3>Exportera</h3>
    <div class="export">
      <button type="button" id="exp-csv">CSV</button>
      <button type="button" id="exp-json">JSON</button>
    </div>
    <p>Datan sparas bara på den här telefonen. Exportera då och då som backup.</p>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- Data ----------
  // Sparat format: { version: 1, entries: [{ id, number, kind: 'seen'|'rode', ts }] }
  // ts = millisekunder sedan 1970 (Date.now()). Ändras formatet höjs version och migrate() uppdateras.
  const KEY = 'tagglogg:data';
  const BACKUP_KEY = 'tagglogg:data:backup-unreadable';
  const VERSION = 1;

  const toastEl = document.getElementById('toast');
  let toastTimer;

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isError);
    clearTimeout(toastTimer);
    if (!isError) toastTimer = setTimeout(() => { toastEl.textContent = ''; }, 3000);
  }

  function emptyData() { return { version: VERSION, entries: [] }; }

  function migrate(d) {
    // Här läggs framtida migreringar (version 1 -> 2 osv).
    return d;
  }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return emptyData(); }
    if (!raw) return emptyData();
    try {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.entries)) return migrate(d);
      throw new Error('oväntat format');
    } catch (e) {
      // Skriv inte över data vi inte kan läsa: spara en kopia först.
      try { localStorage.setItem(BACKUP_KEY, raw); } catch (_) {}
      showToast('Sparad data kunde inte läsas. En kopia har sparats.', true);
      return emptyData();
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      showToast('Kunde inte spara! Exportera datan och kontrollera lagringen.', true);
      return false;
    }
  }

  let data = load();

  // ---------- Hjälpfunktioner ----------
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const timeStr = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const kindLabel = k => (k === 'rode' ? 'Åkt' : 'Sett');

  function dayLabel(key) {
    const now = Date.now();
    if (key === dayKey(now)) return 'Idag';
    if (key === dayKey(now - 86400000)) return 'Igår';
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function normalize(s) { return s.trim().replace(/\s+/g, ' ').toUpperCase(); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- Rendering ----------
  const logEl = document.getElementById('log');
  const totalEl = document.getElementById('total');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    const entries = data.entries.slice().sort((a, b) => b.ts - a.ts);
    totalEl.textContent = entries.length ? `${entries.length} loggningar` : '';
    logEl.textContent = '';

    if (!entries.length) {
      logEl.appendChild(el('div', 'empty', 'Inget loggat än. Skriv ett fordonsnummer och tryck Sett eller Åkt.'));
      return;
    }

    const groups = new Map();
    for (const e of entries) {
      const k = dayKey(e.ts);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }

    for (const [key, list] of groups) {
      const day = el('section', 'day');
      const h = el('h2');
      h.appendChild(el('span', '', dayLabel(key)));
      h.appendChild(el('span', '', String(list.length)));
      day.appendChild(h);

      const box = el('div', 'entries');
      for (const e of list) {
        const row = el('div', 'entry');
        row.appendChild(el('span', 'time', timeStr(e.ts)));
        row.appendChild(el('span', 'num', e.number));
        row.appendChild(el('span', 'badge ' + (e.kind === 'rode' ? 'rode' : 'seen'), kindLabel(e.kind)));
        const del = el('button', 'del', '✕');
        del.type = 'button';
        del.setAttribute('aria-label', 'Ta bort ' + e.number);
        del.addEventListener('click', () => removeEntry(e.id));
        row.appendChild(del);
        box.appendChild(row);
      }
      day.appendChild(box);
      logEl.appendChild(day);
    }
  }

  // ---------- Åtgärder ----------
  const input = document.getElementById('num');

  function addEntry(kind) {
    const number = normalize(input.value);
    if (!number) {
      showToast('Skriv ett fordonsnummer först.', true);
      input.focus();
      return;
    }
    data.entries.push({ id: newId(), number, kind, ts: Date.now() });
    if (save()) showToast(`Loggat: ${number} (${kindLabel(kind).toLowerCase()})`);
    input.value = '';
    input.focus();            // håller tangentbordet uppe för nästa tåg
    render();
  }

  function removeEntry(id) {
    const e = data.entries.find(x => x.id === id);
    if (!e) return;
    if (!confirm(`Ta bort ${e.number} (${kindLabel(e.kind).toLowerCase()} ${timeStr(e.ts)})?`)) return;
    data.entries = data.entries.filter(x => x.id !== id);
    save();
    render();
  }

  document.getElementById('btn-seen').addEventListener('click', () => addEntry('seen'));
  document.getElementById('btn-rode').addEventListener('click', () => addEntry('rode'));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry('seen'); });

  // ---------- Export ----------
  function csvCell(v) {
    v = String(v);
    return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function buildCSV() {
    // Semikolon som avgränsare och BOM så att svensk Excel öppnar filen rätt.
    const rows = [['id', 'datum', 'tid', 'fordon', 'typ']];
    for (const e of data.entries.slice().sort((a, b) => a.ts - b.ts)) {
      rows.push([e.id, dayKey(e.ts), timeStr(e.ts) + ':' + pad(new Date(e.ts).getSeconds()), e.number, kindLabel(e.kind)]);
    }
    return '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
  }

  async function exportFile(name, mime, text) {
    const blob = new Blob([text], { type: mime });
    try {
      const file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // användaren avbröt delningen
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  const stamp = () => dayKey(Date.now());
  document.getElementById('exp-csv').addEventListener('click', () =>
    exportFile(`tagglogg-${stamp()}.csv`, 'text/csv', buildCSV()));
  document.getElementById('exp-json').addEventListener('click', () =>
    exportFile(`tagglogg-${stamp()}.json`, 'application/json', JSON.stringify(data, null, 2)));

  // ---------- Start ----------
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // Ladda om en gång när en ny version av appen tar över.
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  }
})();
</script>
</body>
</html>
