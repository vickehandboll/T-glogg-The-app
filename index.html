<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tåglogg</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tåglogg">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #14202f;
    --muted: #6b7a90;
    --line: #e1e6ee;
    --accent: #1f5fbf;
    --seen: #1f5fbf;
    --rode: #c2410c;
    --header: #0f1b2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1320;
      --card: #14202f;
      --text: #e8edf5;
      --muted: #8fa3bf;
      --line: #25344a;
      --accent: #5b9bff;
      --seen: #5b9bff;
      --rode: #fb923c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    background: var(--header);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .total { font-size: 14px; opacity: .8; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .logger {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .logger input {
    width: 100%;
    font-size: 22px;           /* >=16px hindrar iOS från att zooma */
    padding: 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    text-transform: uppercase;
    outline: none;
  }
  .logger input::placeholder { text-transform: none; font-size: 18px; }
  .logger input:focus { border-color: var(--accent); }
  .fields { display: grid; grid-template-columns: 5fr 7fr; gap: 10px; }
  .fields input { min-width: 0; }
  .hintrow { display: flex; align-items: center; gap: 8px; height: 36px; margin-top: 6px; }   /* fast höjd: knapparna ska inte hoppa */
  .namehint {
    flex: 1; min-width: 0;
    height: 20px; line-height: 20px;
    font-size: 15px; font-weight: 600; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mult {
    flex: none; max-width: 58%;
    height: 34px; padding: 0 14px;
    font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mult[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mult:disabled { opacity: .45; }
  .hintrow + .buttons { margin-top: 2px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .buttons button {
    font-size: 19px; font-weight: 600;
    padding: 16px 8px;
    border: 0; border-radius: 12px;
    color: #fff;
  }
  .buttons button:active { transform: scale(.98); opacity: .9; }
  #btn-seen { background: var(--seen); }
  #btn-rode { background: var(--rode); }
  .toast {
    min-height: 22px;
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .toast.error { color: #dc2626; }

  .day { margin-top: 22px; }
  .day h2 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    display: flex; justify-content: space-between;
  }
  .entries {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .entry {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  .entry:first-child { border-top: 0; }
  .entry .time { color: var(--muted); font-variant-numeric: tabular-nums; width: 46px; flex: none; }
  .entry .num { flex: 1; font-weight: 600; font-size: 18px; word-break: break-word; }
  .entry .num .vname { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }

  /* Vagnar som gick i mult i samma tåg: en lodrät linje med en punkt för varje vagn. */
  .entry.grp { position: relative; padding-left: 32px; }
  .entry.grp::before { content: ''; position: absolute; left: 17px; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .entry.grp:not(.first)::before { top: -1px; }
  .entry.grp.first::before { top: 50%; }
  .entry.grp.last::before { bottom: 50%; }
  .entry.grp::after { content: ''; position: absolute; left: 13px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); }
  .entry.grp:not(.first) { border-top-color: transparent; }
  .badge {
    font-size: 12px; font-weight: 600; color: #fff;
    padding: 3px 9px; border-radius: 999px; flex: none;
  }
  .badge.seen { background: var(--seen); }
  .badge.rode { background: var(--rode); }
  .entry .del {
    border: 0; background: none; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 6px 8px; flex: none;
  }
  .empty { text-align: center; color: var(--muted); margin: 40px 0; }

  footer { margin-top: 30px; }
  footer h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .sync { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sync button {
    font-size: 15px; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text);
  }
  .sync button:disabled { opacity: .5; }
  footer p { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  .gh-settings { margin-top: 12px; font-size: 14px; }
  .gh-settings summary { color: var(--muted); padding: 6px 0; }
  .gh-settings label { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .gh-settings input {
    display: block; width: 100%; margin-top: 4px;
    font-size: 16px;           /* >=16px hindrar iOS från att zooma */
    padding: 10px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
</style>
</head>
<body>
<header>
  <h1>Tåglogg</h1>
  <span class="total" id="total"></span>
</header>

<main>
  <section class="logger">
    <div class="fields">
      <input id="model" type="text" placeholder="Modell"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
             enterkeyhint="next" aria-label="Fordonsmodell, t.ex. Rc6 eller C20">
      <input id="num" type="text" inputmode="numeric" placeholder="Nummer"
             autocomplete="off" autocorrect="off" spellcheck="false"
             enterkeyhint="done" aria-label="Fordonsnummer">
    </div>
    <div class="hintrow">
      <div class="namehint" id="namehint" aria-live="polite"></div>
      <button type="button" class="mult" id="btn-mult" aria-pressed="false" disabled>I mult</button>
    </div>
    <div class="buttons">
      <button type="button" id="btn-seen">Sett</button>
      <button type="button" id="btn-rode">Åkt</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <div id="log"></div>

  <footer>
    <h3>GitHub-synk</h3>
    <div class="sync">
      <button type="button" id="gh-push">Spara till GitHub</button>
      <button type="button" id="gh-pull">Hämta från GitHub</button>
    </div>
    <div class="toast" id="gh-status" role="status" aria-live="polite"></div>
    <details class="gh-settings" id="gh-settings">
      <summary>Inställningar</summary>
      <label>GitHub-användare
        <input id="gh-owner" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Repo för datan (privat)
        <input id="gh-repo" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Token (Contents: Read and write)
        <input id="gh-token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
    </details>

    <p>Datan sparas på den här telefonen. Spara till GitHub då och då som backup.</p>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- Data ----------
  // Sparat format: { version: 2, entries: [{ id, model, number, kind: 'seen'|'rode', ts, group? }] }
  // model = t.ex. "RC6" eller "C20" (kan vara tomt), number = fordonsnumret, t.ex. "1362".
  // group = valfritt id som delas av vagnar som gick i mult i samma tåg. Varje vagn har ändå sin egen kind
  // (Sett/Åkt), så vi sparar vad som faktiskt hände och regeln för hur grupper räknas kan väljas senare.
  // ts = millisekunder sedan 1970 (Date.now()). Ändras formatet höjs version och migrate() uppdateras.
  // Version 1 hade ingen model, där stod hela texten i number ("RC6 1362").
  const KEY = 'tagglogg:data';
  const BACKUP_KEY = 'tagglogg:data:backup-unreadable';
  const VERSION = 2;

  const toastEl = document.getElementById('toast');
  let toastTimer;

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isError);
    clearTimeout(toastTimer);
    if (!isError) toastTimer = setTimeout(() => { toastEl.textContent = ''; }, 3000);
  }

  function emptyData() { return { version: VERSION, entries: [] }; }

  function migrate(d) {
    if ((d.version || 1) < 2) {
      // Version 1 -> 2: "RC6 1362" delas i model "RC6" och number "1362". Det som inte följer
      // mönstret (modell, mellanslag, siffror) lämnas orört: model blir tomt och hela texten ligger kvar i number.
      d.entries = d.entries.map(e => {
        const m = typeof e.number === 'string' && /^([A-ZÅÄÖ][A-ZÅÄÖ0-9]*)\s+(\d[\d\s-]*)$/.exec(e.number);
        return Object.assign({}, e, m ? { model: m[1], number: m[2].trim() } : { model: '' });
      });
      d.version = 2;
    }
    return d;
  }

  let migratedFrom = null;   // sätts om sparad data var äldre och har migrerats

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return emptyData(); }
    if (!raw) return emptyData();
    try {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.entries)) {
        const v = d.version || 1;
        if (v < VERSION) {
          // Spara originalet innan datan byggs om. Går det inte migrerar vi bara i minnet.
          try { localStorage.setItem(KEY + ':backup-v' + v, raw); migratedFrom = v; } catch (_) {}
        }
        return migrate(d);
      }
      throw new Error('oväntat format');
    } catch (e) {
      // Skriv inte över data vi inte kan läsa: spara en kopia först.
      try { localStorage.setItem(BACKUP_KEY, raw); } catch (_) {}
      showToast('Sparad data kunde inte läsas. En kopia har sparats.', true);
      return emptyData();
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      showToast('Kunde inte spara! Spara till GitHub och kontrollera lagringen.', true);
      return false;
    }
  }

  let data = load();
  if (migratedFrom) save();   // spara den migrerade datan direkt, originalet ligger kvar i backup-nyckeln

  // ---------- Hjälpfunktioner ----------
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const timeStr = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const kindLabel = k => (k === 'rode' ? 'Åkt' : 'Sett');
  const vehicleLabel = e => (e.model ? e.model + ' ' : '') + e.number;
  const latestEntry = () => data.entries.reduce((a, b) => (!a || b.ts > a.ts ? b : a), null);

  function dayLabel(key) {
    const now = Date.now();
    if (key === dayKey(now)) return 'Idag';
    if (key === dayKey(now - 86400000)) return 'Igår';
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function normalize(s) { return s.trim().replace(/\s+/g, ' ').toUpperCase(); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- Vagnarnas namn ----------
  // vagnnamn.json: { series: { "C20": { "2045": "Ellen", ... }, "C30": { ... } } }. Namnet slås upp när det visas
  // och sparas inte i loggen, så en uppdaterad lista gäller även äldre loggningar. Modellen måste stämma
  // (andra serier kan ha samma nummer). Saknas filen eller kan inte läsas visas bara inga namn.
  let names = null;
  const own = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);

  function vehicleName(model, number) {
    if (!names || !own(names.series, model) || !own(names.series[model], number)) return '';
    return String(names.series[model][number]);
  }

  // ---------- Rendering ----------
  const logEl = document.getElementById('log');
  const totalEl = document.getElementById('total');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    updateMult();
    const entries = data.entries.slice().sort((a, b) => b.ts - a.ts);
    // Vagnar i samma tåg ligger alltid i en följd. De visas i den ordning de loggades (främsta först),
    // även om listan i övrigt har senaste loggningen överst.
    for (let i = 0; i < entries.length;) {
      let j = i + 1;
      while (entries[i].group && j < entries.length && entries[j].group === entries[i].group) j++;
      if (j - i > 1) entries.splice(i, j - i, ...entries.slice(i, j).reverse());
      i = j;
    }
    totalEl.textContent = entries.length ? `${entries.length} loggningar` : '';
    logEl.textContent = '';

    if (!entries.length) {
      logEl.appendChild(el('div', 'empty', 'Inget loggat än. Skriv ett fordonsnummer och tryck Sett eller Åkt.'));
      return;
    }

    const groups = new Map();
    for (const e of entries) {
      const k = dayKey(e.ts);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(e);
    }

    for (const [key, list] of groups) {
      const day = el('section', 'day');
      const h = el('h2');
      h.appendChild(el('span', '', dayLabel(key)));
      h.appendChild(el('span', '', String(list.length)));
      day.appendChild(h);

      const box = el('div', 'entries');
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        const row = el('div', 'entry');
        // Bara två eller fler intilliggande vagnar med samma grupp ritas som ett tåg i mult.
        const linkedUp = i > 0 && !!e.group && list[i - 1].group === e.group;
        const linkedDown = i < list.length - 1 && !!e.group && list[i + 1].group === e.group;
        if (linkedUp || linkedDown) row.className = 'entry grp' + (linkedUp ? '' : ' first') + (linkedDown ? '' : ' last');
        row.appendChild(el('span', 'time', timeStr(e.ts)));
        const num = el('span', 'num', vehicleLabel(e));
        const nm = vehicleName(e.model, e.number);
        if (nm) num.appendChild(el('span', 'vname', nm));
        row.appendChild(num);
        row.appendChild(el('span', 'badge ' + (e.kind === 'rode' ? 'rode' : 'seen'), kindLabel(e.kind)));
        const del = el('button', 'del', '✕');
        del.type = 'button';
        del.setAttribute('aria-label', 'Ta bort ' + vehicleLabel(e));
        del.addEventListener('click', () => removeEntry(e.id));
        row.appendChild(del);
        box.appendChild(row);
      }
      day.appendChild(box);
      logEl.appendChild(day);
    }
  }

  // ---------- Åtgärder ----------
  const modelInput = document.getElementById('model');
  const input = document.getElementById('num');
  const hintEl = document.getElementById('namehint');
  const multBtn = document.getElementById('btn-mult');

  // "I mult": nästa loggning hör till samma tåg som den senast loggade vagnen. Gäller bara en loggning
  // (och nollställs vid omstart), så man kommer inte åt att koppla ihop olika tåg av misstag.
  let multOn = false;

  function updateMult() {
    const prev = latestEntry();
    if (!prev) multOn = false;
    multBtn.disabled = !prev;
    multBtn.setAttribute('aria-pressed', String(multOn));
    multBtn.textContent = multOn ? `I mult med ${prev.number}` : 'I mult';
  }

  // Visar vagnens namn medan man skriver, så man ser att det blev rätt tåg innan man trycker.
  function updateHint() { hintEl.textContent = vehicleName(normalize(modelInput.value), normalize(input.value)); }

  // Modellen förifylls med den senast loggade och står kvar efter varje loggning,
  // så flera tåg av samma serie bara kräver nummer + ett tryck.
  const newest = latestEntry();
  if (newest && newest.model) modelInput.value = newest.model;

  function addEntry(kind) {
    const model = normalize(modelInput.value);
    const number = normalize(input.value);
    if (!number) {
      showToast('Skriv ett fordonsnummer först.', true);
      input.focus();
      return;
    }
    const entry = { id: newId(), model, number, kind, ts: Date.now() };
    const prev = latestEntry();
    const inMult = multOn && !!prev;
    if (inMult) {
      if (!prev.group) prev.group = newId();   // den förra vagnen blir första vagnen i gruppen
      entry.group = prev.group;
    }
    multOn = false;
    data.entries.push(entry);
    const nm = vehicleName(model, number);
    if (save()) showToast(`Loggat${inMult ? ' i mult' : ''}: ${vehicleLabel(entry)}${nm ? ' – ' + nm : ''} (${kindLabel(kind).toLowerCase()})`);
    modelInput.value = model;
    input.value = '';
    updateHint();
    input.focus();            // håller tangentbordet uppe för nästa tåg
    render();
  }

  function removeEntry(id) {
    const e = data.entries.find(x => x.id === id);
    if (!e) return;
    if (!confirm(`Ta bort ${vehicleLabel(e)} (${kindLabel(e.kind).toLowerCase()} ${timeStr(e.ts)})?`)) return;
    data.entries = data.entries.filter(x => x.id !== id);
    if (e.group) {
      // En ensam vagn är inget tåg i mult: rensa gruppen om bara en vagn blev kvar.
      const rest = data.entries.filter(x => x.group === e.group);
      if (rest.length === 1) delete rest[0].group;
    }
    save();
    render();
  }

  multBtn.addEventListener('click', () => {
    multOn = !multOn;
    updateMult();
    showToast(multOn ? `Nästa loggning går i mult med ${vehicleLabel(latestEntry())}.` : '');
    input.focus();
  });

  document.getElementById('btn-seen').addEventListener('click', () => addEntry('seen'));
  document.getElementById('btn-rode').addEventListener('click', () => addEntry('rode'));
  modelInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.focus(); } });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry('seen'); });
  modelInput.addEventListener('input', updateHint);
  input.addEventListener('input', updateHint);

  // ---------- GitHub-synk ----------
  // Sparar datan som JSON ({ version, entries }) i filen taglogg.json i ett privat repo (GitHubs contents-API).
  // Varje sparning blir en commit. Telefonen är huvudlager, GitHub är backup/synk ("senaste vinner").
  // Inställningarna (inkl. token) ligger i en egen nyckel och följer aldrig med i datafilen.
  const GH_KEY = 'tagglogg:github';
  const PULL_BACKUP_KEY = 'tagglogg:data:backup-before-pull';
  const GH_FILE = 'taglogg.json';
  const GH_DEFAULTS = { owner: 'vickehandboll', repo: 'taglogg-data', token: '', lastSha: '', lastSync: 0 };
  const ERR_NOT_FOUND = 'Hittade inte repot eller filen (404). Kontrollera användarnamn, reponamn och att token gäller det repot.';

  const ghOwnerEl = document.getElementById('gh-owner');
  const ghRepoEl = document.getElementById('gh-repo');
  const ghTokenEl = document.getElementById('gh-token');
  const ghStatusEl = document.getElementById('gh-status');
  const ghSettingsEl = document.getElementById('gh-settings');
  const ghPushBtn = document.getElementById('gh-push');
  const ghPullBtn = document.getElementById('gh-pull');

  function ghLoad() {
    try { return Object.assign({}, GH_DEFAULTS, JSON.parse(localStorage.getItem(GH_KEY) || '{}')); }
    catch (e) { return Object.assign({}, GH_DEFAULTS); }
  }
  function ghStore() {
    try { localStorage.setItem(GH_KEY, JSON.stringify(gh)); } catch (e) {}
  }

  // lastSha = filens version på GitHub vid senaste lyckade spara/hämta. Används för att upptäcka
  // att GitHub-filen ändrats av något annat än den här telefonen innan vi skriver över den.
  let gh = ghLoad();
  let ghBusy = false;

  function ghStatus(msg, isError) {
    ghStatusEl.textContent = msg;
    ghStatusEl.classList.toggle('error', !!isError);
  }

  function ghIdleStatus() {
    ghStatus(gh.lastSync ? `Senast synkat ${dayKey(gh.lastSync)} ${timeStr(gh.lastSync)}.` : '');
  }

  function toBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  function fromBase64(b64) {
    const bin = atob(b64);   // atob struntar i radbrytningarna som GitHub lägger in
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }

  function validEntry(e) {
    return !!e && typeof e.id === 'string' && typeof e.number === 'string' && Number.isFinite(e.ts)
      && (e.model === undefined || typeof e.model === 'string')
      && (e.group === undefined || typeof e.group === 'string');
  }

  // Läser fälten, sparar dem och kollar att inget saknas. Returnerar false (och öppnar rutan) om något saknas.
  function ghReadSettings() {
    const owner = ghOwnerEl.value.trim();
    const repo = ghRepoEl.value.trim();
    const token = ghTokenEl.value.trim();
    if (owner !== gh.owner || repo !== gh.repo) gh.lastSha = '';   // annat repo = ingen känd synkpunkt
    gh.owner = owner; gh.repo = repo; gh.token = token;
    ghStore();
    if (!owner || !repo || !token) {
      ghSettingsEl.open = true;
      ghStatus('Fyll i användare, repo och token under Inställningar.', true);
      return false;
    }
    return true;
  }

  async function ghRequest(method, body, accept) {
    const url = `https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${GH_FILE}`;
    const headers = { 'Authorization': 'Bearer ' + gh.token, 'Accept': accept || 'application/vnd.github+json' };
    if (body) headers['Content-Type'] = 'application/json';
    try {
      // no-store: GitHub låter webbläsaren cacha svar en minut, och då får vi en gammal sha.
      return await fetch(url, { method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw new Error('Ingen uppkoppling till GitHub. Försök igen.');
    }
  }

  async function ghErrorText(res) {
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch (_) {}
    if (res.status === 401) return 'Token ogiltig eller utgången (401). Skapa en ny på GitHub.';
    if (res.status === 403) return `Ingen åtkomst (403). Kontrollera att token har Contents: Read and write för repot. ${msg}`.trim();
    if (res.status === 404) return ERR_NOT_FOUND;
    if (res.status === 409 || res.status === 422) return `Filen ändrades på GitHub under tiden. Försök igen. ${msg}`.trim();
    return `GitHub svarade ${res.status}. ${msg}`.trim();
  }

  // Hämtar filen: { sha, text } eller null om den inte finns.
  async function ghGet() {
    const res = await ghRequest('GET');
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(await ghErrorText(res));
    const j = await res.json();
    let text;
    if (j.encoding === 'base64') {
      text = fromBase64(j.content);
    } else {
      // Filer över 1 MB kommer utan innehåll i första svaret; hämta råtexten i stället.
      const raw = await ghRequest('GET', null, 'application/vnd.github.raw+json');
      if (!raw.ok) throw new Error(await ghErrorText(raw));
      text = await raw.text();
    }
    return { sha: j.sha, text };
  }

  function countEntries(text) {
    try { return JSON.parse(text).entries.length; } catch (e) { return null; }
  }

  async function ghPush() {
    ghStatus('Sparar till GitHub…');
    const remote = await ghGet();
    if (remote && remote.sha !== gh.lastSha) {
      const n = countEntries(remote.text);
      const remoteInfo = n === null ? '' : ` (${n} loggningar)`;
      if (!confirm(`GitHub har en version${remoteInfo} som den här telefonen inte har hämtat eller sparat själv. Telefonen har ${data.entries.length} loggningar. Skriva över GitHub-versionen?`)) {
        ghStatus('Avbrutet. Inget sparades.');
        return;
      }
    }
    const body = {
      message: `Tåglogg: ${data.entries.length} loggningar (${dayKey(Date.now())} ${timeStr(Date.now())})`,
      content: toBase64(JSON.stringify(data, null, 2))
    };
    if (remote) body.sha = remote.sha;
    const res = await ghRequest('PUT', body);
    if (!res.ok) throw new Error(await ghErrorText(res));
    const j = await res.json();
    gh.lastSha = j.content.sha;
    gh.lastSync = Date.now();
    ghStore();
    ghStatus(`Sparat till GitHub: ${data.entries.length} loggningar.`);
  }

  async function ghPull() {
    ghStatus('Hämtar från GitHub…');
    const remote = await ghGet();
    if (!remote) throw new Error(ERR_NOT_FOUND);
    let d;
    try { d = JSON.parse(remote.text); } catch (e) { throw new Error('Filen på GitHub är inte giltig JSON.'); }
    if (!d || !Array.isArray(d.entries) || !d.entries.every(validEntry)) throw new Error('Filen på GitHub har ett format som appen inte förstår.');
    if (d.version > VERSION) throw new Error('Filen är sparad av en nyare version av appen. Uppdatera appen först.');
    d = migrate(d);

    if (!confirm(`Ersätta datan på telefonen (${data.entries.length} loggningar) med GitHub-versionen (${d.entries.length} loggningar)? En kopia av nuvarande data sparas först.`)) {
      ghStatus('Avbrutet. Inget ändrades.');
      return;
    }
    // Ersätter vi lokal data ska en kopia finnas kvar, annars avbryter vi.
    try { localStorage.setItem(PULL_BACKUP_KEY, JSON.stringify(data)); }
    catch (e) { throw new Error('Kunde inte spara en säkerhetskopia av nuvarande data. Spara till GitHub först. Inget ändrades.'); }

    const old = data;
    data = d;
    if (!save()) { data = old; throw new Error('Kunde inte spara den hämtade datan på telefonen. Inget ändrades.'); }
    gh.lastSha = remote.sha;
    gh.lastSync = Date.now();
    ghStore();
    render();
    ghStatus(`Hämtat från GitHub: ${data.entries.length} loggningar.`);
  }

  async function ghRun(action) {
    if (ghBusy) return;
    if (!ghReadSettings()) return;
    ghBusy = true;
    ghPushBtn.disabled = ghPullBtn.disabled = true;
    try { await action(); }
    catch (e) { ghStatus(e.message, true); }
    finally { ghBusy = false; ghPushBtn.disabled = ghPullBtn.disabled = false; }
  }

  ghOwnerEl.value = gh.owner;
  ghRepoEl.value = gh.repo;
  ghTokenEl.value = gh.token;
  ghSettingsEl.open = !gh.token;
  ghIdleStatus();
  ghPushBtn.addEventListener('click', () => ghRun(ghPush));
  ghPullBtn.addEventListener('click', () => ghRun(ghPull));

  // ---------- Start ----------
  render();
  fetch('vagnnamn.json')
    .then(r => (r.ok ? r.json() : null))
    .then(j => { if (j && j.series) { names = j; render(); updateHint(); } })
    .catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // Ladda om en gång när en ny version av appen tar över.
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  }
})();
</script>
</body>
</html>
